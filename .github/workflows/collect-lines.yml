# Every 2 hours from 9 am to 11 pm ET (13:00-03:00 UTC), plus 1, 3 and 7 am ET, save Sleeper's NBA prop lines and
# per-game projections, plus our league's matchup scores, to the data-snapshots branch
# (see scripts/collect_lines.py).
# Turn it off under Actions -> Collect Sleeper lines -> "..." -> Disable workflow.
name: Collect Sleeper lines

on:
  schedule:
    - cron: '23 13-23/2 * * *'
    - cron: '23 1,3,5,7,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: collect-lines

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        run: |
          if git fetch --depth=1 origin data-snapshots; then
            git worktree add -B data-snapshots snapshots FETCH_HEAD
          else
            git worktree add --orphan -b data-snapshots snapshots
          fi

      - name: Save lines and projections
        run: python3 scripts/collect_lines.py snapshots

      - name: Commit
        working-directory: snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin data-snapshots
